# Checks the sources, builds the game and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing may write by default; only the deploy job below can publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Check data and assets
        run: python tools/check.py
      - name: Build
        run: python tools/build.py
      - name: Note if the committed index.html is stale
        run: git diff --quiet -- index.html || echo "::notice::index.html in the repository differs from the sources. The published site is built from the sources, so this only matters when opening index.html directly. Run python tools/build.py and commit to refresh it."
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
